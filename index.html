<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVAC Price List</title>
<style>
:root{
 --blue:#0057a8;
 --blue-dark:#003f7d;
 --light-blue:#eaf4ff;
 --border:#c7d1dc;
 --text:#1f2937;
 --muted:#64748b;
 --surface:#ffffff;
}
*{box-sizing:border-box}
body{
 font-family:Arial,Helvetica,sans-serif;
 background:linear-gradient(135deg,#eef4f9,#f8fafc);
 color:var(--text);
 margin:0;
 padding:32px 16px;
}
.container{
 max-width:920px;
 margin:auto;
 background:var(--surface);
 padding:32px;
 border-radius:18px;
 box-shadow:0 16px 45px rgba(15,23,42,.12);
 border:1px solid #e5eaf0;
}
h1{
 margin:0 0 28px;
 text-align:center;
 color:var(--blue);
 font-size:clamp(28px,5vw,42px);
 letter-spacing:.3px;
}
.section-label{
 text-align:center;
 margin:20px 0 12px;
 font-size:15px;
 font-weight:800;
 color:#334155;
 text-transform:uppercase;
 letter-spacing:1px;
}
.topbuttons,.brandbuttons,.tonnagebuttons{
 display:flex;
 justify-content:center;
 gap:12px;
 flex-wrap:wrap;
 margin-bottom:18px;
}
.topbuttons{
 flex-wrap:nowrap;
}
.topbuttons button{
 flex:1 1 0;
 min-width:0;
 padding-left:12px;
 padding-right:12px;
}
button{
 appearance:none;
 border:1px solid #cbd5e1;
 border-radius:10px;
 background:#f8fafc;
 color:#334155;
 cursor:pointer;
 font-weight:800;
 font-size:15px;
 padding:13px 20px;
 min-width:150px;
 transition:transform .15s ease,box-shadow .15s ease,background .15s ease,color .15s ease,border-color .15s ease;
}
button:hover{
 transform:translateY(-2px);
 box-shadow:0 7px 16px rgba(15,23,42,.12);
 border-color:#8db7df;
}
button.active{
 background:linear-gradient(135deg,var(--blue),#1976d2);
 border-color:var(--blue);
 color:#fff;
 box-shadow:0 8px 18px rgba(0,87,168,.25);
}
.brandbuttons button{min-width:130px}
.tonnage-section{display:none;margin-top:8px;margin-bottom:18px}
.tonnage-section.show{display:block}
.tonnagebuttons{gap:9px;margin-bottom:0}
.tonnagebuttons button{min-width:82px;padding:11px 14px}
.individual-table td:nth-child(2){font-family:Consolas,monospace;font-size:14px;text-align:center;word-break:break-word}
.individual-table td:last-child{font-size:17px;text-align:center}
.individual-table th:nth-child(2){text-align:center}
.individual-summary{padding:16px 18px;background:#f8fbff;border-bottom:1px solid #e2e8f0;text-align:center;color:#334155;font-weight:700}
.content-card{
 margin-top:26px;
 border:1px solid #dbe3ea;
 border-radius:14px;
 overflow:hidden;
 box-shadow:0 8px 22px rgba(15,23,42,.07);
}
.logo-area{
 text-align:center;
 padding:24px 16px 18px;
 background:linear-gradient(#ffffff,#f8fafc);
 border-bottom:1px solid #e2e8f0;
}
.brand-logo{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 gap:10px;
 font-weight:900;
 letter-spacing:.5px;
 line-height:1;
}
.brand-mark{display:inline-block}
.brand-logo.carrier{color:#0057a8;font-size:38px;font-style:italic}
.brand-logo.carrier .brand-mark{width:19px;height:19px;border-radius:50%;background:#e31b23;box-shadow:inset 0 0 0 5px #fff;border:2px solid #e31b23}
.brand-logo.goodman{color:#e87500;font-size:36px}
.brand-logo.goodman .brand-mark{width:26px;height:26px;border:5px solid #e87500;border-radius:3px;transform:rotate(45deg)}
.brand-logo.trane{color:#d71920;font-size:37px;font-style:italic}
.brand-logo.trane .brand-mark{width:30px;height:18px;border:3px solid #d71920;border-radius:50%;position:relative}
.brand-logo.trane .brand-mark:after{content:"";position:absolute;left:4px;right:4px;top:6px;border-top:3px solid #d71920;transform:skewX(-25deg)}
.mode-note{
 text-align:center;
 margin-top:8px;
 color:var(--muted);
 font-size:14px;
}
.table-wrap{overflow-x:auto}
table{
 width:100%;
 border-collapse:collapse;
 background:white;
 min-width:440px;
}
th,td{
 border:1px solid var(--border);
 padding:14px 16px;
 text-align:center;
}
th{
 background:#dcecff;
 color:#17324d;
 font-size:15px;
 text-transform:uppercase;
 letter-spacing:.4px;
}
td{font-size:17px}
tbody tr:nth-child(even){background:#f8fbff}
tbody tr:hover{background:#eef6ff}
td:last-child{font-weight:800;color:#0f3f6e}
.note{
 text-align:center;
 padding:45px 20px;
 color:#64748b;
 font-size:18px;
 background:#fafcff;
}
@media(max-width:640px){
 body{padding:14px 10px}
 .container{padding:22px 14px;border-radius:14px}
 .topbuttons,.brandbuttons,.tonnagebuttons{display:grid;grid-template-columns:1fr;gap:9px}
 .topbuttons{display:grid}
 button{width:100%;min-width:0}
 th,td{padding:12px 10px}
 .brand-logo.carrier,.brand-logo.goodman,.brand-logo.trane{font-size:31px}
}

.finance-language-section{
 margin-top:26px;
 padding-top:22px;
 border-top:1px solid #dbe3ec;
 text-align:center;
}
.finance-language-section h3{
 margin:0 0 14px;
 font-size:18px;
 color:#334155;
}
.language-buttons{
 display:flex;
 justify-content:center;
 gap:12px;
 margin-bottom:18px;
}
.language-buttons button{
 min-width:120px;
}
.finance-image{
 display:block;
 width:100%;
 height:auto;
 margin:0 auto;
 border:1px solid #cbd5e1;
 border-radius:12px;
 box-shadow:0 8px 24px rgba(15,23,42,.10);
}


/* Center all Excel-style table content */
table th, table td { text-align:center !important; vertical-align:middle; }
/* Embedded Plenum Calculator */
.plenum-panel{margin-top:24px;border:1px solid #dbe3ea;border-radius:14px;overflow:hidden;background:white;box-shadow:0 8px 22px rgba(15,23,42,.07)}
.plenum-panel-header{padding:16px 20px;background:#eaf4ff;color:#17324d;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.plenum-panel-header strong{font-size:19px}
.plenum-panel-header a{color:#0057a8;font-weight:700}
.plenum-iframe{display:block;width:100%;height:850px;min-height:70vh;border:0;background:#fff}
@media(max-width:640px){.plenum-iframe{height:900px}.topbuttons{grid-template-columns:1fr 1fr}.topbuttons button{font-size:12px;padding:12px 5px;min-width:0}}
/* Lennox-only additions; original three brands are not restyled. */
.brand-logo.lennox{color:#86502b;font-size:36px}
.brand-logo.lennox .brand-mark{width:25px;height:25px;border:5px solid #86502b;border-radius:50%;border-right-color:transparent;transform:rotate(-35deg)}
.lennox-seer{display:none;text-align:center;margin:10px 0 18px;background:#fff7ef;border:1px solid #e4c9af;border-radius:10px;padding:12px 10px;color:#75421e}
.lennox-seer.show{display:block}
.lennox-seer strong{display:block;margin-bottom:7px;font-size:14px;text-transform:uppercase;letter-spacing:.5px}
.lennox-seer .values{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;font-size:14px}
@media(max-width:640px){.brand-logo.lennox{font-size:31px}}
/* Staff-only app; avoid flashing any price markup before authentication. */
[hidden] {display:none !important}
.auth-panel{max-width:430px;margin:8vh auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 32px #0001}
.auth-panel h2{color:#0057a8;margin:0 0 8px}.auth-panel p{color:#64748b}
.login-form{display:flex;flex-direction:column;gap:12px}
.login-form input{padding:14px;border-radius:9px;border:1px solid #c7d1dc;font:inherit}
#authError{color:#b91c1c;margin:0}.staff-toolbar{max-width:920px;margin:0 auto 16px;display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.staff-toolbar button{min-width:0;padding:10px 15px;font-size:13px}
 .activity-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:16px}.activity-stat{background:#f8fbff;border:1px solid #dbe3ea;border-radius:10px;padding:12px;text-align:center}.activity-stat strong{display:block;font-size:24px;color:#0057a8}.activity-table td{font-size:13px}.activity-table th{font-size:12px}.activity-table td:first-child{overflow-wrap:anywhere}.activity-controls{padding:12px;text-align:center}.activity-controls button{min-width:0}

/* Mobile-only responsive tables: preserve desktop layout. */
@media (max-width: 640px) {
 .container {padding:20px 10px;}
 .content-card {margin-top:18px;}
 .table-wrap {width:100%; min-width:0; overflow-x:auto;}
 table {width:100%; min-width:0; table-layout:fixed;}
 table th, table td {padding:9px 4px; font-size:12px; line-height:1.3; white-space:normal; overflow-wrap:anywhere; word-break:normal; letter-spacing:0;}
 table th {font-size:11px;}
 table:not(.individual-table):not(.activity-table) th:first-child {width:13%;}
 .individual-table th:first-child {width:32%;}
 .individual-table th:nth-child(2) {width:40%;}
 .individual-table th:last-child {width:28%;}
 .individual-table td:nth-child(2) {font-size:11px; overflow-wrap:anywhere; word-break:normal;}
 .individual-table td:last-child {font-size:12px;}
 .purchase-table th:first-child {width:25%;}
 .purchase-table th:nth-child(2) {width:30%;}
 .purchase-table th:nth-child(3) {width:23%;}
 .purchase-table th:last-child {width:22%;}
 .individual-summary {padding:12px 6px;font-size:13px;}
 .activity-summary {grid-template-columns:repeat(2,minmax(0,1fr));padding:10px;gap:8px;}
 .activity-stat {padding:9px 4px;font-size:12px;}
 /* Five-column activity table becomes a readable per-user record on phones. */
 .activity-table, .activity-table tbody, .activity-table tr, .activity-table td {display:block;width:100%;}
 .activity-table thead {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
 .activity-table tbody tr {padding:8px 10px;border-bottom:1px solid var(--border);}
 .activity-table tbody td {display:grid;grid-template-columns: minmax(0, 34%) minmax(0, 1fr);gap:8px;align-items:center;text-align:left !important;border:0;padding:7px 0;font-size:12px;}
 .activity-table td::before {font-weight:700;color:var(--muted);content:attr(data-label);}
 .activity-table td:first-child {font-weight:700;color:var(--blue-dark);}
 .activity-table td:last-child {font-weight:400;}
}
/* Stock column: individual equipment only. */
.stock-table td:nth-child(3){font-weight:800;color:#0f3f6e;font-variant-numeric:tabular-nums}
.stock-table td.stock-high{color:#15803d}.stock-table td.stock-low{color:#a16207}.stock-table td.stock-zero{color:#b91c1c}.stock-table td.stock-unknown{color:#64748b}
.stock-note{padding:10px 12px;text-align:center;font-size:12px;color:#475569;background:#f8fbff;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere}
.stock-note.stock-warning{color:#92400e;background:#fffbeb}
@media(max-width:640px){
 .stock-table th:first-child{width:29%}.stock-table th:nth-child(2){width:36%}.stock-table th:nth-child(3){width:23%}.stock-table th:last-child{width:12%}
 .stock-table td:nth-child(3){font-size:11px}.stock-table td:last-child{font-size:12px}.stock-table th:last-child{font-size:10px}
 .stock-note{font-size:11px;padding:8px 5px}
}
</style>
</head>
<body>
<div id="authPanel" class="auth-panel"><form id="loginForm" class="login-form"><h2>Alvizo HVAC Staff Login</h2><p>Authorized employees only</p><input required autocomplete="username" type="email" id="email" placeholder="Email"><input required autocomplete="current-password" type="password" id="password" placeholder="Password"><button type="submit" id="loginBtn">Sign in</button><p id="authError" role="alert"></p></form></div>
<div id="staffToolbar" class="staff-toolbar" hidden><span id="signedIn"></span><button id="refreshPrices" type="button">Refresh prices</button><button id="signOut" type="button">Sign out</button></div>
<div class="container" id="pricingApp" hidden>
 <h1>HVAC Price List</h1>

 <div class="section-label">Choose a Pricing Category</div>
 <div class="topbuttons">
 <button id="equipBtn" class="active" onclick="setMode('equipment')">Full Equipment Set</button>
 <button id="individualBtn" onclick="setMode('individual')">Individual Equipment</button>
 <button id="installBtn" onclick="setMode('install')">Installation</button>
 <button id="financeBtn" onclick="setMode('finance')">Installation with Financing</button>
 <button id="activityBtn" onclick="setMode('activity')" hidden>User Activity</button>
 <button id="purchaseBtn" onclick="setMode('purchase')" hidden>Purchase</button>
 
  <button id="plenumBtn" onclick="setMode('plenum')">Plenum Calculator</button>
 </div>

 <div id="brandHeading" class="section-label">Choose Equipment Brand</div>
 <div class="brandbuttons" id="brandButtons">
 <button id="Goodman" class="active" onclick="setBrand('Goodman')">Goodman</button>
 <button id="Carrier" onclick="setBrand('Carrier')">Carrier</button>
 <button id="Lennox" onclick="setBrand('Lennox')">Lennox</button>
 <button id="Trane" onclick="setBrand('Trane')">Trane</button>
 </div>

 <div id="tonnageSection" class="tonnage-section">
 <div class="section-label">Choose Tonnage</div>
 <div class="tonnagebuttons">
 <button id="ton2" class="active" onclick="setTonnage(2)">2</button>
 <button id="ton2_5" onclick="setTonnage(2.5)">2.5</button>
 <button id="ton3" onclick="setTonnage(3)">3</button>
 <button id="ton3_5" onclick="setTonnage(3.5)">3.5</button>
 <button id="ton4" onclick="setTonnage(4)">4</button>
 <button id="ton5" onclick="setTonnage(5)">5</button>
 </div>
 </div>

  <div id="lennoxSeer" class="lennox-seer"></div>
  <div id="content"></div><p id="loadStatus" role="status" style="text-align:center;color:#64748b"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
'use strict';
// Publishable project values are intentionally public. RLS and column grants enforce access.
const API_URL = 'https://uaetebnakduygbdmzchg.supabase.co';
const PUBLISHABLE_KEY = 'sb_publishable_SJOFz8dSoOfHBjFhcD4VoQ_21QGO9B8';
// Keep each employee signed in on this browser across page reloads and restarts.
// Supabase stores session tokens, not the employee password.
const sb = window.supabase.createClient(API_URL, PUBLISHABLE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    storageKey: 'alvizo-dv-project-auth'
  }
});
const brands = ['Goodman','Carrier','Lennox','Trane'];
const tonnages = [2,2.5,3,3.5,4,5];
const seer2 = {
 '2':{gas:15.8,electric:16,heatPump:15.2},'2.5':{gas:15.5,electric:16,heatPump:15.5},
 '3':{gas:14.7,electric:16,heatPump:15.2},'3.5':{gas:15.5,electric:14.7,heatPump:14.3},
 '4':{gas:13.8,electric:14.7,heatPump:14.3},'5':{gas:13.8,electric:13.8,heatPump:14.3}
};
let role=null, mode='equipment',brand='Goodman', selectedTonnage=2;
let equipment=[], systemPrices=[], purchaseSources=[];
let inventoryStock=new Map(), stockSyncedAt=null, stockError='', stockLoading=false, stockRequest=0, stockTimer=null;
const stockKey=value=>String(value??'').trim().toUpperCase();
const STOCK_REFRESH_MS=60000;
const STOCK_STALE_MS=15*60*1000;
const $ = id => document.getElementById(id);
const money = value => Number(value).toLocaleString('en-US',{style:'currency',currency:'USD'});
const escapeHTML = value => String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(message){$('loadStatus').textContent=message||''}
function shell(show){$('authPanel').hidden=show;$('staffToolbar').hidden=!show;$('pricingApp').hidden=!show}
function setMode(m){
 if(['purchase','activity'].includes(m) && role!=='admin')return;
 mode=m;
 const ids={equipment:'equipBtn',individual:'individualBtn',install:'installBtn',finance:'financeBtn',purchase:'purchaseBtn',activity:'activityBtn',plenum:'plenumBtn'};
 Object.values(ids).forEach(id=>$(id).classList.toggle('active',id===ids[m]));
 $('tonnageSection').classList.toggle('show',m==='individual'||m==='purchase');
 $('brandHeading').hidden=['plenum','activity'].includes(m);$('brandButtons').hidden=['plenum','activity'].includes(m);
 render();
 if(m==='activity')void loadActivity();
 if(m==='individual')void loadStock();
}
function setBrand(b){ brand=b;brands.forEach(x=>$(x).classList.toggle('active',x===b));render() }
function setTonnage(t){
 selectedTonnage=t;
 tonnages.forEach(x=>$(x===2.5?'ton2_5':x===3.5?'ton3_5':'ton'+x).classList.toggle('active',x===t));render();
}
window.setMode=setMode;window.setBrand=setBrand;window.setTonnage=setTonnage;
function logo(name){
 const nameText=escapeHTML(name), nameClass=name.toLowerCase();
 const labels={equipment:'Full Equipment Set',individual:'Individual Equipment',install:'Installation',finance:'Installation with Financing',purchase:'Purchase · Supplier Sources'};
 return `<div class="logo-area"><div class="brand-logo ${nameClass}"><span class="brand-mark"></span><span>${nameText}</span></div><div class="mode-note">${labels[mode]||''}</div></div>`;
}
function table(rows,header){
 if(!rows.length)return '<div class="note">No pricing available for this brand yet.</div>';
 return `<div class="table-wrap"><table><thead><tr><th>Tons</th><th>${escapeHTML(header)}</th></tr></thead><tbody>`+
 rows.map(r=>`<tr><td>${r.tonnage}</td><td>${money(r.listed_price)}</td></tr>`).join('')+'</tbody></table></div>';
}
function rowsFor(category){return systemPrices.filter(r=>r.brand===brand&&r.category===category).sort((a,b)=>Number(a.tonnage)-Number(b.tonnage))}
function fullSetTable(){
 const full=new Map(rowsFor('equipment').map(x=>[Number(x.tonnage),x.listed_price]));
 const hp=new Map(rowsFor('equipment_heat_pump').map(x=>[Number(x.tonnage),x.listed_price]));
 if(!full.size&&!hp.size)return '<div class="note">No system prices available.</div>';
 const tons=[...new Set([...full.keys(),...hp.keys()])].sort((a,b)=>a-b);
 return `<div class="table-wrap"><table><thead><tr><th>Tons</th>${brand==='Lennox'?'<th>SEER2 Gas</th>':''}<th>Full System Price</th><th>Heat Pump Price</th></tr></thead><tbody>`+
 tons.map(t=>`<tr><td>${t}</td>${brand==='Lennox'?`<td>${seer2[t]?.gas??'—'}</td>`:''}<td>${full.has(t)?money(full.get(t)):'—'}</td><td>${hp.has(t)?money(hp.get(t)):'—'}</td></tr>`).join('')+'</tbody></table></div>';
}
function stockCell(model){
 const value=inventoryStock.get(stockKey(model));
 if(value==null)return '<td class="stock-unknown" title="No matching stock record">—</td>';
 const cls=value<=0?'stock-zero':value<=2?'stock-low':'stock-high';
 return `<td class="${cls}">${escapeHTML(value)}</td>`;
}
function stockNote(){
 const date=stockSyncedAt?new Date(stockSyncedAt).toLocaleString('en-US',{timeZone:'America/Chicago',timeZoneName:'short'}):null;
 const stale=stockSyncedAt&&Date.now()-Date.parse(stockSyncedAt)>STOCK_STALE_MS;
 let message='Stock on Hand · Garland 110 + 115';
 if(date)message+=' · Last sync: '+date;
 if(stockError)message+=' · Stock refresh failed; '+(date?'showing last loaded quantities':'stock unavailable');
 else if(!date)message+=stockLoading?' · Loading stock…':' · Stock not yet available';
 if(stale)message+=' · Stock may be outdated';
 return `<div class="stock-note${stockError||stale?' stock-warning':''}" role="status">${escapeHTML(message)} · — = unavailable / unmatched</div>`;
}
async function loadStock(){
 if(!role||stockLoading)return;
 const request=++stockRequest;stockLoading=true;
 try{
  const rows=[];
  for(let offset=0;;offset+=500){
   const result=await sb.from('inventory_stock').select('sku,total_stock,last_synced_at').order('sku').range(offset,offset+499);
   if(request!==stockRequest||!role)return;
   if(result.error)throw result.error;
   const page=result.data??[];rows.push(...page);if(page.length<500)break;
  }
  if(!rows.length)throw new Error('No inventory snapshot returned');
  const times=new Set(rows.map(r=>r.last_synced_at));
  if(times.size!==1||!Number.isFinite(Date.parse(rows[0].last_synced_at)))throw new Error('Inventory snapshot changed during refresh');
  const next=new Map(), duplicates=new Set();
  for(const r of rows){
   const key=stockKey(r.sku);
   if(!key||r.total_stock==null||r.total_stock===''||!Number.isFinite(Number(r.total_stock)))continue;
   if(next.has(key)||duplicates.has(key)){next.delete(key);duplicates.add(key);continue;}
   next.set(key,Number(r.total_stock));
  }
  inventoryStock=next;stockSyncedAt=rows[0].last_synced_at;stockError='';
 }catch(error){if(request===stockRequest){stockError=error.message||String(error);console.warn('Inventory stock:',stockError);}}
 finally{if(request===stockRequest){stockLoading=false;if(role&&mode==='individual')render();}}
}
function individualTable(){
 const rows=equipment.filter(r=>r.brand===brand&&Number(r.tonnage)===selectedTonnage&&r.active!==false);
 if(!rows.length)return '<div class="note">No equipment entries for this tonnage.</div>';
 const heading=`${selectedTonnage} Ton - Individual ${escapeHTML(brand)} Equipment`;
 return `<div class="individual-summary">${heading}</div>${stockNote()}<div class="table-wrap"><table class="individual-table stock-table"><thead><tr><th>Equipment</th><th>Model</th><th>Price</th><th>Stock</th></tr></thead><tbody>`+
 rows.map(r=>`<tr><td>${escapeHTML(r.equipment_type)}</td><td>${escapeHTML(r.model)}</td><td>${money(r.sale_price)}</td>${stockCell(r.model)}</tr>`).join('')+'</tbody></table></div>';
}
// Financing images are served as separate static files for reliable deployment.
const FINANCING_IMAGES = {en:'assets/financing-en.png',es:'assets/financing-es.png'};
function purchaseTable(){
 if(role!=='admin')return '<div class="note">Not authorized.</div>';
 const rows=purchaseSources.filter(r=>r.brand===brand&&Number(r.tonnage)===selectedTonnage);
 if(!rows.length)return '<div class="note">No purchasing sources for this selection.</div>';
 return `<div class="individual-summary">${selectedTonnage} Ton — ${escapeHTML(brand)} Purchasing Sources</div><div class="table-wrap"><table class="individual-table purchase-table"><thead><tr><th>Equipment</th><th>Model</th><th>Purchased with</th><th>Purchase Cost</th></tr></thead><tbody>`+
 rows.map(r=>`<tr><td>${escapeHTML(r.equipment_type)}</td><td>${escapeHTML(r.model)}</td><td>${escapeHTML(r.purchased_with)}</td><td>${r.purchase_price==null?'Not entered':money(r.purchase_price)}</td></tr>`).join('')+'</tbody></table></div>';
}
async function loadPurchases(){
 if(role!=='admin'){purchaseSources=[];return;}
 const result=await sb.from('purchase_sources').select('brand,tonnage,equipment_type,model,purchased_with,purchase_price').order('brand').order('tonnage');
 if(result.error){purchaseSources=[];status('Unable to load purchasing information: '+result.error.message);return;}
 purchaseSources=result.data??[];
}
function financingLanguageSection(){return `<div class="finance-language-section"><h3>Choose Financing Language</h3><div class="language-buttons"><button id="englishFinanceBtn" class="active" onclick="showFinancingLanguage('en')">English</button><button id="spanishFinanceBtn" onclick="showFinancingLanguage('es')">Spanish</button></div><img id="financingPlanImage" class="finance-image" src="${FINANCING_IMAGES.en}" alt="English financing plans"></div>`;}
function showFinancingLanguage(lang){
 const image=$('financingPlanImage');if(!image)return;
 const spanish=lang==='es';image.src=FINANCING_IMAGES[spanish?'es':'en'];
 image.alt=spanish?'Planes de financiamiento en español':'English financing plans';
 $('englishFinanceBtn').classList.toggle('active',!spanish);$('spanishFinanceBtn').classList.toggle('active',spanish);
}
window.showFinancingLanguage=showFinancingLanguage;
let activityRows=[], activityUsers=[], activityError='', activityLoading=false, activityRequest=0;
const activityDate = value => value ? new Date(value).toLocaleString('en-US',{timeZone:'America/Chicago'}) : '—';
async function recordActivity(eventType){
 try { const {error}=await sb.from('user_activity').insert({event_type:eventType}); if(error) console.warn('Activity tracking:',error.message); }
 catch(error){console.warn('Activity tracking:',error);}
}
async function loadActivity(){
 if(role!=='admin')return;
 const request=++activityRequest; activityLoading=true; activityError=''; render();
 try {
  const staff=await sb.rpc('get_activity_users');
  if(staff.error)throw staff.error;
  const rows=[];
  for(let offset=0;;offset+=500){
   const result=await sb.from('user_activity').select('id,user_id,event_type,created_at').order('id').range(offset,offset+499);
   if(result.error)throw result.error;
   rows.push(...(result.data||[])); if((result.data||[]).length<500)break;
   if(request!==activityRequest||role!=='admin')return;
  }
  if(request!==activityRequest||role!=='admin')return;
  activityRows=rows; activityUsers=staff.data||[];
 }catch(error){if(request===activityRequest)activityError=error.message||String(error);}
 finally{if(request===activityRequest){activityLoading=false;if(role==='admin'&&mode==='activity')render();}}
}
function activityTable(){
 if(role!=='admin')return '';
 const now=Date.now();
 const dayKey=value=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value));
 const today=dayKey(now), month=today.slice(0,7);
 const stats=new Map(activityUsers.map(u=>[u.user_id,{name:u.email||'No email available',logins:0,visits:0,lastLogin:null,lastVisit:null}]));
 const totals={today:0,week:0,month:0};
 for(const r of activityRows){
  if(!stats.has(r.user_id))stats.set(r.user_id,{name:'Unknown or former user',logins:0,visits:0,lastLogin:null,lastVisit:null});
  const item=stats.get(r.user_id), key=r.event_type==='login'?'lastLogin':'lastVisit';
  item[r.event_type==='login'?'logins':'visits']++;
  if(!item[key]||Date.parse(r.created_at)>Date.parse(item[key]))item[key]=r.created_at;
  if(r.event_type==='visit'){const date=dayKey(r.created_at);if(date===today)totals.today++;if(Date.parse(r.created_at)>=now-7*86400000)totals.week++;if(date.slice(0,7)===month)totals.month++;}
 }
 const cards=[['Users',stats.size],['Visits today',totals.today],['Visits last 7 days',totals.week],['Visits this month',totals.month]];
 return '<div class="content-card"><div class="logo-area"><h2>User Activity</h2><div class="mode-note">Administrator only · Central Time · Visits count authenticated page loads</div></div><div class="activity-controls"><button type="button" onclick="loadActivity()">Refresh activity</button></div>'+ (activityLoading?'<div class="note">Loading activity…</div>':activityError?'<div class="note">Unable to load activity: '+escapeHTML(activityError)+'</div>':'<div class="activity-summary">'+cards.map(([label,value])=>`<div class="activity-stat"><strong>${value}</strong>${label}</div>`).join('')+'</div><div class="table-wrap"><table class="activity-table"><thead><tr><th>User</th><th>Logins</th><th>Visits</th><th>Last login</th><th>Last visit</th></tr></thead><tbody>'+[...stats.values()].sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(r=>`<tr><td data-label="User">${escapeHTML(r.name)}</td><td data-label="Logins">${r.logins}</td><td data-label="Visits">${r.visits}</td><td data-label="Last login">${activityDate(r.lastLogin)}</td><td data-label="Last visit">${activityDate(r.lastVisit)}</td></tr>`).join('')+'</tbody></table></div>')+'</div>';
}
window.loadActivity=loadActivity;
function render(){
 if(!role)return;
 const seerPanel=$('lennoxSeer');const showSeer=brand==='Lennox'&&mode==='individual';seerPanel.classList.toggle('show',showSeer);
 seerPanel.innerHTML=showSeer?`<strong>${selectedTonnage} Ton — SEER2 Ratings</strong><div class="values"><span>Gas: <b>${seer2[selectedTonnage]?.gas??'—'}</b></span><span>Electric: <b>${seer2[selectedTonnage]?.electric??'—'}</b></span><span>Heat Pump: <b>${seer2[selectedTonnage]?.heatPump??'—'}</b></span></div>`:'';
 if(mode==='activity'){ $('content').innerHTML=activityTable();return; }
 if(mode==='plenum'){
 $('content').innerHTML='<section class="plenum-panel"><div class="plenum-panel-header"><strong>Plenum Calculator</strong><a href="https://plenums.vercel.app/" target="_blank" rel="noopener noreferrer">Open in new tab ↗</a></div><iframe class="plenum-iframe" title="Plenum Calculator" src="https://plenums.vercel.app/" loading="eager" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe></section>';return;
 }
 let content=mode==='purchase'?purchaseTable():mode==='equipment'?fullSetTable():mode==='individual'?individualTable():mode==='install'?table(rowsFor('install'),'Installation Price'):table(rowsFor('finance'),'Installation with Financing')+financingLanguageSection();
 $('content').innerHTML='<div class="content-card">'+logo(brand)+content+'</div>';
}
async function loadPrices(){
 status('Loading current prices…');
 const [e,s]=await Promise.all([
  sb.from('equipment').select('id,brand,model,equipment_type,tonnage,sale_price,active').order('brand').order('tonnage'),
  sb.from('system_prices').select('brand,tonnage,category,listed_price').order('brand').order('tonnage')
 ]);
 if(e.error||s.error){status('Unable to load prices: '+(e.error?.message||s.error?.message));$('content').innerHTML='';return}
 equipment=e.data??[];systemPrices=s.data??[];
 status(`Updated ${new Date().toLocaleTimeString()}`);render();
}
async function useSession(session, explicitLogin=false){
 clearInterval(stockTimer);stockTimer=null;stockRequest++;stockLoading=false;inventoryStock=new Map();stockSyncedAt=null;stockError='';
 role=null;purchaseSources=[];activityRows=[];activityUsers=[];activityError='';activityLoading=false;activityRequest++;$('activityBtn').hidden=true;$('content').innerHTML='';$('purchaseBtn').hidden=true;shell(false);$('authError').textContent='';
 if(!session){$('password').value='';return}
 const staff=await sb.from('staff').select('role').eq('user_id',session.user.id).maybeSingle();
 if(staff.error||!['viewer','editor','admin'].includes(staff.data?.role)){
  await sb.auth.signOut();$('authError').textContent='This account is not authorized for Alvizo pricing.';return;
 }
 role=staff.data.role;$('activityBtn').hidden=role!=='admin';if(role!=='admin'&&['activity','purchase'].includes(mode))setMode('equipment');$('purchaseBtn').hidden=role!=='admin';$('signedIn').textContent=`${session.user.email} · ${role}`;shell(true);stockTimer=setInterval(()=>{if(role&&mode==='individual'&&!document.hidden)void loadStock();},STOCK_REFRESH_MS);await Promise.all([loadPrices(),loadPurchases(),loadStock(),(async()=>{if(explicitLogin)await recordActivity('login');await recordActivity('visit');})()]);render();if(mode==='activity')void loadActivity();
}
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();$('authError').textContent='';$('loginBtn').disabled=true;
 const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
 $('loginBtn').disabled=false;
 if(error){$('authError').textContent=error.message;return}
 await useSession(data.session,true);
});
$('signOut').addEventListener('click',async()=>{await sb.auth.signOut();await useSession(null)});
$('refreshPrices').addEventListener('click',async()=>{await Promise.all([loadPrices(),loadPurchases(),loadStock()]);render();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&role&&mode==='individual')void loadStock();});
(async()=>{const {data,error}=await sb.auth.getSession();if(error){$('authError').textContent=error.message;return}await useSession(data.session)})();
// Purchase information is requested from Supabase only for the admin role. RLS additionally enforces access.
</script>
